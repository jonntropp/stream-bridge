<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Bridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- STILI GENERALI --- */
        body { 
            background-color: #0f0f0f; color: #e0e0e0; 
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; padding: 0; box-sizing: border-box; overflow: hidden;
        }
        
        .container { max-width: 480px; width: 100%; text-align: center; padding: 20px; z-index: 10; }

        .card { 
            background: #1a1a1a; padding: 40px 30px; border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.7); border: 1px solid #333;
            display: none; animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h2 { color: #fff; margin: 0 0 15px 0; font-weight: 600; font-size: 22px; }
        p { color: #aaa; line-height: 1.6; margin-bottom: 30px; font-size: 14px; max-width: 95%; margin-left: auto; margin-right: auto; }
        .highlight { color: #4caf50; font-weight: 600; } 

        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .btn { 
            display: flex; align-items: center; justify-content: center; width: 100%; padding: 18px 0; 
            text-decoration: none; border-radius: 12px; font-size: 15px; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s ease; box-sizing: border-box;
        }
        .btn:active { transform: scale(0.98); }
        .btn-install { background: #fff; color: #000; }
        .btn-install:hover { background: #e0e0e0; }
        .btn-confirm { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid #444; }
        .btn-confirm:hover { background: rgba(255, 255, 255, 0.2); border-color: #666; }

        .skip-link { color: #666; font-size: 13px; text-decoration: underline; margin-top: 25px; display: inline-block; cursor: pointer; transition: color 0.2s; }
        .skip-link:hover { color: #999; }
        #penaltyView { display: none; margin-top: 20px; }
        .timer-bar { width: 100%; height: 6px; background: #000; margin-top: 15px; border-radius: 3px; overflow: hidden; }
        .timer-fill { height: 100%; background: #2d9cdb; width: 0%; transition: width 0.1s linear; }

        .loader { border: 3px solid #222; border-top: 3px solid #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- STILI PLAYER IMMERSIVO --- */
        #startOverlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999; display: none; align-items: center; justify-content: center; cursor: pointer;
        }
        
        /* NUOVO TASTO PLAY CENTRALE */
        #startBtn {
            background: rgba(180, 20, 30, 0.85); 
            color: white; 
            border: none; 
            width: 80px; 
            height: 80px;
            border-radius: 50%; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(180, 20, 30, 0.5); 
            transition: transform 0.2s, background 0.2s;
        }
        #startBtn svg { width: 35px; height: 35px; margin-left: 6px; fill: currentColor; }
        #startBtn:hover { transform: scale(1.1); background: rgba(220, 20, 30, 1); }
        #startBtn:active { transform: scale(0.95); }

        #playerContainer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; background: #000; z-index: 50;
        }
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 10; }

        /* SENSORI MOUSE E TRIGGER FULLSCREEN */
        .edge-sensor { position: absolute; z-index: 20; }
        #sensorTop { top: 0; left: 0; width: 100%; height: 15%; }
        #sensorLeft { top: 0; left: 0; width: 15%; height: calc(100% - 90px); }
        #sensorRight { top: 0; right: 0; width: 15%; height: calc(100% - 90px); }
        #sensorBottom { bottom: 90px; left: 0; width: 100%; height: 15%; }

        #fullscreenTrigger {
            position: absolute; bottom: 5px; right: 15px; width: 50px; height: 50px;
            z-index: 110; cursor: pointer; background: transparent;
        }

        /* --- TITOLO E PULSANTI ELEGANTI --- */
        
        /* Nuovo Titolo Stile Netflix */
        #playerTitle {
            position: absolute;
            top: 30px; left: 40px;
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            opacity: 0; pointer-events: none; 
            transition: opacity 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 100;
        }

        .overlay-btn {
            position: absolute; 
            background: rgba(20, 20, 20, 0.4); 
            color: #eaeaea; 
            text-decoration: none; padding: 10px 24px; border-radius: 30px; 
            font-size: 14px; font-weight: 500; letter-spacing: 0.8px;
            border: 1px solid rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            opacity: 0; pointer-events: none; 
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
            z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: 'Poppins', sans-serif;
        }
        
        #playerTitle.visible, .overlay-btn.visible { opacity: 1; pointer-events: auto; }
        
        .overlay-btn:hover { 
            background: rgba(160, 20, 30, 0.75); 
            border-color: rgba(255, 255, 255, 0.2); 
            transform: scale(1.03); 
            color: #fff;
        }

        /* Posizionamenti */
        #btnPrev { top: 85%; left: 40px; transform: translateY(-50%); }
        #btnNext { top: 85%; right: 40px; transform: translateY(-50%); }
        #btnBot  { top: 30px; right: 40px; } /* Spostato a DESTRA */

        @media (max-width: 768px) {
            #playerTitle { top: 20px; left: 20px; font-size: 16px; }
            .overlay-btn { padding: 8px 18px; font-size: 12px; }
            #btnPrev { left: 20px; }
            #btnNext { right: 20px; }
            #btnBot  { top: 20px; right: 20px; } /* Spostato a DESTRA su mobile */
            #fullscreenTrigger { bottom: 0px; right: 0px; width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <div class="container" id="authContainer">
        <div id="loaderView">
            <div class="loader"></div>
            <p style="font-size: 12px; color: #555;">Verifica sicurezza...</p>
        </div>

        <div id="mainView" class="card">
            <div id="choiceContent">
                <h2 id="titleText">Visione senza interruzioni</h2>
                <p id="descText">
                    Il video contiene finestre popup. Installa la protezione consigliata per guardare con <span class="highlight">zero pubblicità</span>.
                </p>
                <div class="btn-group">
                    <a href="#" id="btnInstall" target="_blank" class="btn btn-install">Installa Protezione</a>
                    <button onclick="setProtectedAndGo()" class="btn btn-confirm">Ho già la protezione</button>
                </div>
                <a onclick="triggerPenalty()" class="skip-link">Non installare e continua con le pubblicità &rarr;</a>
            </div>

            <div id="penaltyView">
                <div class="loader" style="width:30px; height:30px; border-width:2px;"></div>
                <p style="margin-bottom: 10px;">Attendi il caricamento del video...</p>
                <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
            </div>
        </div>
    </div>

    <div id="startOverlay" onclick="startImmersiveExperience()">
        <button id="startBtn">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
    </div>

    <div id="playerContainer">
        <div id="sensorTop" class="edge-sensor"></div>
        <div id="sensorLeft" class="edge-sensor"></div>
        <div id="sensorRight" class="edge-sensor"></div>
        <div id="sensorBottom" class="edge-sensor"></div>

        <div id="fullscreenTrigger" onclick="toggleFullscreen(event)"></div>

        <iframe id="videoFrame" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
        
        <div id="playerTitle"></div>

        <a href="#" id="btnBot" class="overlay-btn">Torna al Bot</a>
        <a href="#" id="btnPrev" class="overlay-btn">Ep. Precedente</a>
        <a href="#" id="btnNext" class="overlay-btn">Prossimo Ep.</a>
    </div>

    <script>
        // --- 1. CONFIGURAZIONE E URL PARSING ---
        const params = new URLSearchParams(window.location.search);
        let rawUrl = params.get('url');
        let videoUrl = (rawUrl && rawUrl !== 'null') ? decodeURIComponent(rawUrl) : null;
        
        const prevTarget = params.get('prev'); 
        const nextTarget = params.get('next'); 
        const titleTarget = params.get('title'); 
        const botUsername = "NomeDelTuoBot"; // <--- INSERISCI QUI IL NOME DEL BOT

        if (videoUrl && !videoUrl.includes('primaryColor=')) {
            const separator = videoUrl.includes('?') ? '&' : '?';
            videoUrl += separator + "primaryColor=E50914&autoplay=true&secondaryColor=111111";
        }

        const STORAGE_KEY = 'stream_bridge_consent_v3'; 
        const LINKS = {
            chrome: "https://chromewebstore.google.com/detail/ublock-origin-lite/ddkjiahejlhfcafbddmgiahcphecmpfh",
            edge: "https://microsoftedge.microsoft.com/addons/detail/ublock-origin-lite/fkfhgkbmjkgjlipdkhlmhgdjcofaaecp",
            firefox: "https://addons.mozilla.org/it/firefox/addon/ublock-origin/",
            chromeDownload: "https://www.google.com/chrome/",
            android: "https://play.google.com/store/apps/details?id=com.alohamobile.browser",
            ios: "https://apps.apple.com/it/app/aloha-browser-private-vpn/id1105317682"
        };

        function getOS() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(ua)) return "Android";
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "iOS";
            return "Desktop";
        }

        function getBrowserType() {
            const ua = navigator.userAgent;
            if (ua.indexOf("Firefox") > -1) return "firefox";
            if (ua.indexOf("Edg") > -1) return "edge"; 
            if (ua.indexOf("Chrome") > -1) return "chrome";
            return "unknown";
        }
        const os = getOS();

        // --- 2. LOGICA TRANSIZIONE AL PLAYER ---
        function preparePlayerScreen() {
            if (!videoUrl) return;
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('startOverlay').style.display = 'flex'; 
        }

        function setProtectedAndGo() {
            if (!videoUrl) { alert("Errore: URL video mancante."); return; }
            localStorage.setItem(STORAGE_KEY, 'true');
            preparePlayerScreen();
        }

        function triggerPenalty() {
            if (!videoUrl) { alert("Nessun video da caricare."); return; }
            document.getElementById('choiceContent').style.display = 'none';
            document.getElementById('penaltyView').style.display = 'block';
            let duration = 5000, start = Date.now(), bar = document.getElementById('timerFill');
            let timer = setInterval(() => {
                let progress = ((Date.now() - start) / duration) * 100;
                bar.style.width = Math.min(progress, 100) + "%";
                if (progress >= 100) {
                    clearInterval(timer);
                    preparePlayerScreen();
                }
            }, 50);
        }

        // --- 3. INIZIALIZZAZIONE ---
        window.onload = function() {
            if (params.get('reset') === 'true') {
                localStorage.removeItem(STORAGE_KEY);
                document.getElementById('loaderView').style.display = 'none';
                document.getElementById('mainView').style.display = 'block';
                document.getElementById('titleText').innerText = "Configurazione";
                document.getElementById('descText').innerHTML = "Ecco i link per installare la protezione.<br><br>Una volta installata, chiudi questa pagina.";
                document.querySelector('.btn-confirm').style.display = 'none';
                document.querySelector('.skip-link').style.display = 'none';
                return;
            }

            const isProtected = localStorage.getItem(STORAGE_KEY) === 'true';
            
            if (isProtected && videoUrl) {
                preparePlayerScreen();
                return;
            }

            document.getElementById('loaderView').style.display = 'none';
            document.getElementById('mainView').style.display = 'block';

            const btnInstall = document.getElementById('btnInstall');
            const descText = document.getElementById('descText');

            if (!videoUrl) {
                descText.innerHTML = "Errore: Link video mancante.";
                document.querySelector('.btn-group').style.display = 'none';
                document.querySelector('.skip-link').style.display = 'none';
            } else if (os === "Desktop") {
                const browser = getBrowserType();
                if (browser === 'chrome') { btnInstall.href = LINKS.chrome; btnInstall.innerText = "Installa su Chrome"; }
                else if (browser === 'edge') { btnInstall.href = LINKS.edge; btnInstall.innerText = "Installa su Edge"; }
                else if (browser === 'firefox') { btnInstall.href = LINKS.firefox; btnInstall.innerText = "Installa su Firefox"; }
                else { btnInstall.href = LINKS.chromeDownload; btnInstall.innerText = "Scarica Google Chrome"; }
            } else {
                btnInstall.href = os === "Android" ? LINKS.android : LINKS.ios;
                btnInstall.innerText = "Installa Aloha Browser";
            }
        };

        // --- 4. GESTIONE FULLSCREEN MANUALE E TASTO "F" ---
        function toggleFullscreen(e) {
            if(e) e.stopPropagation(); 
            const docElm = document.documentElement;
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            
            if (!isFullscreen) {
                if (docElm.requestFullscreen) docElm.requestFullscreen();
                else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
                else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === 'f' || e.key === 'F') toggleFullscreen(e);
        });

        // --- 5. LOGICA PLAYER E MOVIMENTO MOUSE ---
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnBot = document.getElementById('btnBot');
        const playerTitle = document.getElementById('playerTitle');

        // Settaggio Dati
        btnBot.href = `tg://resolve?domain=${botUsername}`;
        if (prevTarget) btnPrev.href = decodeURIComponent(prevTarget);
        if (nextTarget) btnNext.href = decodeURIComponent(nextTarget);
        if (titleTarget) playerTitle.innerText = decodeURIComponent(titleTarget);

        function startImmersiveExperience() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
            else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();

            document.getElementById('startOverlay').style.display = 'none';
            document.getElementById('playerContainer').style.display = 'block';
            document.getElementById('videoFrame').src = videoUrl;
            
            handleUserActivity();
        }

        let isPaused = false;
        let lastTime = 0;
        let lastDuration = 0;
        let isMouseActive = false;
        let mouseHideTimeout;

        function updateUI() {
            let showPrev = false;
            let showNext = false;
            let showTopBar = false; // Controlla Titolo e Tasto Bot

            if (isPaused || isMouseActive) {
                showTopBar = true;
                if (prevTarget) showPrev = true;
                if (nextTarget) showNext = true;
            } else {
                if (prevTarget && lastTime <= 5) showPrev = true;
                if (nextTarget && lastDuration > 0 && (lastDuration - lastTime <= 10)) showNext = true;
            }

            // Visibilità Elementi
            showTopBar ? btnBot.classList.add('visible') : btnBot.classList.remove('visible');
            showTopBar && titleTarget ? playerTitle.classList.add('visible') : playerTitle.classList.remove('visible');
            
            showPrev ? btnPrev.classList.add('visible') : btnPrev.classList.remove('visible');
            showNext ? btnNext.classList.add('visible') : btnNext.classList.remove('visible');
        }

        function handleUserActivity() {
            isMouseActive = true;
            updateUI();
            
            clearTimeout(mouseHideTimeout);
            mouseHideTimeout = setTimeout(() => {
                isMouseActive = false;
                updateUI();
            }, 3500); 
        }

        document.querySelectorAll('.edge-sensor').forEach(sensor => {
            sensor.addEventListener('mousemove', handleUserActivity);
        });
        window.addEventListener('touchstart', handleUserActivity);
        window.addEventListener('click', handleUserActivity);

        window.addEventListener('message', (event) => {
            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                if (data && data.type === 'PLAYER_EVENT' && data.data) {
                    const payload = data.data;

                    if (payload.event === 'timeupdate') {
                        lastTime = payload.currentTime;
                        lastDuration = payload.duration;
                        updateUI();
                    } 
                    else if (payload.event === 'pause') {
                        isPaused = true;
                        updateUI();
                    } 
                    else if (payload.event === 'play') {
                        isPaused = false;
                        updateUI();
                    }
                    else if (payload.event === 'ended') {
                        if (nextTarget) btnNext.classList.add('visible');
                        btnBot.classList.add('visible');
                        if (titleTarget) playerTitle.classList.add('visible');
                    }
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
