<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Player</title>
    <style>
        /* --- RESET TOTALE --- */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden; font-family: sans-serif;
            color: white; user-select: none; -webkit-user-select: none;
        }

        /* --- OVERLAY INIZIALE (Per forzare il fullscreen) --- */
        #startOverlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        #startBtn {
            background: rgba(229, 9, 20, 0.8); color: white; border: none; padding: 20px 40px;
            font-size: 24px; font-weight: bold; border-radius: 10px; cursor: pointer;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4); transition: transform 0.2s;
        }
        #startBtn:active { transform: scale(0.95); }

        /* --- CONTAINER DEL PLAYER --- */
        #playerContainer {
            position: relative; width: 100vw; height: 100vh; display: none; background: #000;
        }
        
        iframe {
            width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0;
        }

        /* --- PULSANTI IN SOVRAPPOSIZIONE --- */
        .overlay-btn {
            position: absolute; background: rgba(0, 0, 0, 0.7); color: white; 
            text-decoration: none; padding: 15px 25px; border-radius: 8px; font-size: 16px; font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100;
        }
        
        .overlay-btn.visible { opacity: 1; pointer-events: auto; }
        .overlay-btn:hover { background: rgba(229, 9, 20, 0.8); border-color: #E50914; }

        /* Posizionamento specifico */
        #btnPrev { bottom: 40px; left: 40px; }
        #btnNext { bottom: 40px; right: 40px; }
        #btnBot  { top: 40px; left: 40px; background: rgba(20, 20, 20, 0.8); }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .overlay-btn { padding: 10px 15px; font-size: 14px; }
            #btnPrev { bottom: 20px; left: 20px; }
            #btnNext { bottom: 20px; right: 20px; }
            #btnBot  { top: 20px; left: 20px; }
        }
    </style>
</head>
<body>

    <div id="startOverlay" onclick="startImmersiveExperience()">
        <button id="startBtn">▶️ TOCCA PER INIZIARE</button>
    </div>

    <div id="playerContainer">
        <iframe id="videoFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
        
        <a href="#" id="btnBot" class="overlay-btn">🤖 Torna al Bot</a>
        <a href="#" id="btnPrev" class="overlay-btn">⏮️ Ep. Precedente</a>
        <a href="#" id="btnNext" class="overlay-btn">Prossimo Ep. ⏭️</a>
    </div>

    <script>
        // --- 1. LETTURA PARAMETRI URL ---
        const params = new URLSearchParams(window.location.search);
        let rawUrl = params.get('url');
        let videoUrl = (rawUrl && rawUrl !== 'null') ? decodeURIComponent(rawUrl) : null;
        
        // Parametri per la navigazione (es. ?prev=tg://... &next=tg://... &bot=tg://...)
        const prevTarget = params.get('prev'); 
        const nextTarget = params.get('next'); 
        const botUsername = "NomeDelTuoBot"; // <--- INSERISCI QUI IL NOME DEL TUO BOT

        // Elementi DOM
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnBot = document.getElementById('btnBot');
        const container = document.getElementById('playerContainer');

        // Setup base dei link
        btnBot.href = `tg://resolve?domain=${botUsername}`;
        if (prevTarget) btnPrev.href = decodeURIComponent(prevTarget);
        if (nextTarget) btnNext.href = decodeURIComponent(nextTarget);

        // Aggiungi autoplay e colori a vixsrc
        if (videoUrl && !videoUrl.includes('primaryColor=')) {
            const sep = videoUrl.includes('?') ? '&' : '?';
            videoUrl += sep + "primaryColor=E50914&autoplay=true&secondaryColor=111111";
        }

        // --- 2. AVVIO ESPERIENZA FULLSCREEN ---
        function startImmersiveExperience() {
            if (!videoUrl) {
                alert("Errore: Nessun link video fornito.");
                return;
            }

            // Richiedi Fullscreen sul container principale
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
                document.documentElement.msRequestFullscreen();
            }

            // Nascondi overlay, mostra player, carica iframe
            document.getElementById('startOverlay').style.display = 'none';
            container.style.display = 'block';
            document.getElementById('videoFrame').src = videoUrl;
        }

        // --- 3. LOGICA DI COMPARSA PULSANTI ---
        let isPaused = false;

        function updateUI(currentTime, duration) {
            // Se è in pausa, le regole di tempo vengono ignorate dalla logica principale
            if (isPaused) return;

            // Mostra PREV nei primi 5 secondi (se esiste un prevTarget)
            if (prevTarget && currentTime <= 5) {
                btnPrev.classList.add('visible');
            } else if (!isPaused) {
                btnPrev.classList.remove('visible');
            }

            // Mostra NEXT negli ultimi 10 secondi (se esiste un nextTarget)
            if (nextTarget && duration > 0 && (duration - currentTime <= 10)) {
                btnNext.classList.add('visible');
            } else if (!isPaused) {
                btnNext.classList.remove('visible');
            }

            // Durante la riproduzione, nascondi il tasto BOT
            btnBot.classList.remove('visible');
        }

        // Ascolta l'iframe
        window.addEventListener('message', (event) => {
            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                
                if (data && data.type === 'PLAYER_EVENT' && data.data) {
                    const payload = data.data;

                    if (payload.event === 'timeupdate') {
                        updateUI(payload.currentTime, payload.duration);
                    } 
                    else if (payload.event === 'pause') {
                        isPaused = true;
                        // In pausa mostriamo tutto
                        btnBot.classList.add('visible');
                        if (prevTarget) btnPrev.classList.add('visible');
                        if (nextTarget) btnNext.classList.add('visible');
                    } 
                    else if (payload.event === 'play') {
                        isPaused = false;
                        // Al play, nascondiamo forzatamente il bot, il resto lo gestisce timeupdate
                        btnBot.classList.remove('visible');
                    }
                    else if (payload.event === 'ended') {
                        // Se finisce, forza la visualizzazione del Next
                        if (nextTarget) btnNext.classList.add('visible');
                        btnBot.classList.add('visible');
                    }
                }
            } catch (e) {
                // Ignora messaggi non validi
            }
        });
    </script>
</body>
</html>
